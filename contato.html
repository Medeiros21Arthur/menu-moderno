<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Menu Moderno</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="conteudo">
        <h2>Entre em Contato</h2>
        <p>Tem alguma dúvida, proposta ou quer trocar uma ideia? Envie uma mensagem ou entre em contato pelos canais abaixo!</p>

        <div class="contato-container">
            <!-- Informações de Contato -->
            <div class="contato-info">
                <div class="info-card">
                    <div class="info-icone">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="info-texto">
                        <h3>E-mail</h3>
                        <p>contato@exemplo.com</p>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-icone">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="info-texto">
                        <h3>Telefone</h3>
                        <p>+55 (11) 99999-9999</p>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-icone">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div class="info-texto">
                        <h3>Localização</h3>
                        <p>Brasil</p>
                    </div>
                </div>

                <div class="redes-sociais">
                    <a href="#" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="#" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>

            <!-- Formulário de Contato -->
            <form class="formulario-contato" onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!'); this.reset();">
                <div class="campo">
                    <label for="nome">Seu Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">Seu E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Mensagem
                </button>
            </form>
        </div>
    </div>
</body>

</html>
